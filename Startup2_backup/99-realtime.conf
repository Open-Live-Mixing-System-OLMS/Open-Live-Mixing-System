# Realtime Audio Configuration for OLMS
# Aggiungi questa configurazione a /etc/security/limits.d/ per abilitare i permessi realtime

# Gruppo audio: permessi realtime per tutti gli utenti audio
@audio   -   rtprio     95
@audio   -   memlock    unlimited
@audio   -   nice      -19

# Gruppo realtime: permessi aggiuntivi per utenti con privilegi elevati
@realtime -   rtprio     99
@realtime -   memlock    unlimited
@realtime -   nice      -20

# Utente root: permessi massimi per debugging e testing
root     -   rtprio     99
root     -   memlock    unlimited
root     -   nice      -20

# Permessi per l'accesso a shared memory (/dev/shm)
# Questo permette all'utente di gestire i socket JACK senza sudo
francesco_ssh -   memlock    unlimited

# Istruzioni per l'uso:
# 1. Copia questo file in /etc/security/limits.d/99-realtime.conf
# 2. Riavvia la sessione utente o riavvia il sistema
# 3. Verifica con: ulimit -r (dovrebbe mostrare 95 per utenti audio)
# 4. Verifica con: ulimit -l (dovrebbe mostrare "unlimited")