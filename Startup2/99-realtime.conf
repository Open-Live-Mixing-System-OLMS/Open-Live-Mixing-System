# Realtime Audio Configuration for OLMS
# Add this configuration to /etc/security/limits.d/ to enable realtime permissions

# Audio group: realtime permissions for all audio users
@audio   -   rtprio     95
@audio   -   memlock    unlimited
@audio   -   nice      -19

# Realtime group: additional permissions for users with elevated privileges
@realtime -   rtprio     99
@realtime -   memlock    unlimited
@realtime -   nice      -20

# Root user: maximum permissions for debugging and testing
root     -   rtprio     99
root     -   memlock    unlimited
root     -   nice      -20

# Permissions for shared memory access (/dev/shm)
# This allows the user to manage JACK sockets without sudo
francesco_ssh -   memlock    unlimited

# Usage instructions:
# 1. Copy this file to /etc/security/limits.d/99-realtime.conf
# 2. Restart the user session or reboot the system
# 3. Verify with: ulimit -r (should show 95 for audio users)
# 4. Verify with: ulimit -l (should show "unlimited")
