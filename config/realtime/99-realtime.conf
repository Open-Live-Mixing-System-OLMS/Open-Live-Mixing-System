# OLMS Realtime Privileges Configuration
# Optimized for professional audio production with JACK and Ardour
# 
# This configuration provides maximum realtime privileges for audio processes
# to prevent segmentation faults and ensure stable audio performance.

# ============================================================================
# AUDIO GROUP PRIVILEGES (Primary configuration for OLMS)
# ============================================================================
# Grant maximum realtime privileges to the audio group
# This is the primary method for OLMS audio system
@audio - rtprio 99
@audio - memlock unlimited
@audio - nice -20

# ============================================================================
# USER-SPECIFIC PRIVILEGES (Fallback for individual users)
# ============================================================================
# Grant realtime privileges directly to specific users
# Replace 'olms-user' with your actual username if needed
* - rtprio 99
* - memlock unlimited
* - nice -20

# ============================================================================
# JACK AND AUDIO APPLICATION PRIVILEGES
# ============================================================================
# Specific privileges for JACK and audio applications
# These ensure that audio processes get the highest priority
@audio - nofile 524288
@audio - nproc 131072

# ============================================================================
# SYSTEM AUDIO SERVICES
# ============================================================================
# Privileges for system audio services
@audio - rtprio 95
@audio - memlock unlimited

# ============================================================================
# MEMORY AND RESOURCE LIMITS
# ============================================================================
# Memory locking for audio buffers (critical for low latency)
@audio - memlock unlimited

# File descriptor limits for audio applications
@audio - nofile 65536

# Process limits for audio threads
@audio - nproc 32768

# ============================================================================
# JACK-SPECIFIC CONFIGURATION
# ============================================================================
# Additional privileges specifically for JACK processes
@audio - rtprio 99
@audio - nice -19

# ============================================================================
# Ardour and DAW Applications
# ============================================================================
# Privileges for DAW applications and plugins
@audio - rtprio 98
@audio - nice -18

# ============================================================================
# USB Audio Interface Support
# ============================================================================
# Privileges for USB audio interfaces and drivers
@audio - rtprio 97
@audio - nice -17

# ============================================================================
# NOTES AND INSTRUCTIONS
# ============================================================================
# 
# To use this configuration:
# 1. Create the audio group: sudo groupadd audio
# 2. Add your user to the audio group: sudo usermod -aG audio $USER
# 3. Create symlink: sudo ln -sf /path/to/OLMS-Core/config/realtime/99-realtime.conf /etc/security/limits.d/99-realtime.conf
# 4. Log out and log back in for changes to take effect
#
# To verify the configuration:
# - Check group membership: groups $USER
# - Check limits: ulimit -r (should show 99)
# - Check memory lock: ulimit -l (should show unlimited)
#
# For JACK to work properly:
# - Ensure JACK is started with realtime scheduling
# - Verify audio group membership
# - Check that the limits file is properly symlinked
#